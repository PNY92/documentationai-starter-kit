info:
  version: 1.0.0
  title: Zeta Application API
  description: >
    Zeta is a local desktop application with no HTTP or REST API. Its application
    API is the public method surface of the CommerceService class, documented on
    the Application API reference page. This specification exists only to
    document that Zeta has no HTTP endpoints.
